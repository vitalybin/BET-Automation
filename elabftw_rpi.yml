# docker-elabftw configuration file
# Start with: docker compose -f /etc/elabftw.yml up -d
#
# Windows/Docker Desktop friendly version for LAN access from another device
# (for example a Raspberry Pi on the same 192.168.1.0/24 network).
#
# UI and API are both exposed on HTTPS port 443 of the Windows host.
# Access from RasPi with:
#   https://192.168.1.1
# API example:
#   https://192.168.1.1/api/v2/info
#
# IMPORTANT:
#   1) Allow inbound TCP 443 in Windows Firewall on the Private profile.
#   2) SITE_URL and SERVER_NAME below are set to the Windows host IP 192.168.1.1.
#   3) MySQL stays private and is NOT exposed to the LAN.

networks:
  elabftw-net:

services:
  web:
    image: elabftw/elabimg:stable
    restart: always
    container_name: elabftw
    depends_on:
      mysql:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

    # Commented out because this environment previously hit:
    # nginx: bind() to 0.0.0.0:443 failed (13: Permission denied)
    # You can try re-enabling later once everything is confirmed working.
    # cap_drop:
    #   - ALL
    # cap_add:
    #   - CHOWN
    #   - SETGID
    #   - SETUID
    #   - FOWNER
    #   - DAC_OVERRIDE

    environment:
      #######################
      # MYSQL CONFIGURATION #
      #######################
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=elabftw
      - DB_USER=elabftw
      - DB_PASSWORD=VCYxpomuh4hCHrKITRQR0snVF10v2bv
      #- DB_CERT_PATH=/mysql-cert/cert.pem

      #####################
      # PHP CONFIGURATION #
      #####################
      - PHP_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      #- PHP_MAX_CHILDREN=50
      #- PHP_MAX_EXECUTION_TIME=120
      #- MAX_PHP_MEMORY=2G
      #- STATUS_PASSWORD=

      #########################
      # ELABFTW CONFIGURATION #
      #########################
      - SECRET_KEY=def00000ab4e1fac706e4bc31e3f1cdd2e3c1e82ebb29a8e91c125e1ac9fd83ec3faa11aeb056b46b4c488730b9ecfca7b4ed244e8f29fd53ab0c1ab9bf56e33b3e760cf
      - SITE_URL=https://192.168.1.1
      #- MAX_UPLOAD_SIZE=100M
      #- MAX_UPLOAD_TIME=900000
      #- ELAB_AWS_ACCESS_KEY=
      #- ELAB_AWS_SECRET_KEY=

      #######################
      # NGINX CONFIGURATION #
      #######################
      - SERVER_NAME=192.168.1.1
      - DISABLE_HTTPS=false
      - ENABLE_LETSENCRYPT=false
      #- ENABLE_IPV6=false
      #- ELABFTW_USER=nginx
      #- ELABFTW_GROUP=nginx
      #- ELABFTW_USERID=101
      #- ELABFTW_GROUPID=101
      #- SET_REAL_IP=false
      #- SET_REAL_IP_FROM=192.168.31.48, 192.168.0.42, 10.10.13.37
      #- USE_PERSISTENT_MYSQL_CONN=true
      #- NGINX_WORK_PROC=auto
      # Only needed if browser JavaScript on another origin calls the API.
      #- ALLOW_ORIGIN=https://raspi-hostname-or-app-origin
      #- ALLOW_METHODS=GET, POST, PATCH, PUT, DELETE, OPTIONS
      #- ALLOW_HEADERS=Content-Type, Authorization
      #- KEEPALIVE_TIMEOUT=10s

      #######################
      # REDIS CONFIGURATION #
      #######################
      #- USE_REDIS=false
      #- REDIS_HOST=redis
      #- REDIS_PORT=6379
      #- REDIS_USERNAME=
      #- REDIS_PASSWORD=

      ######################
      # LDAP CONFIGURATION #
      ######################
      #- LDAP_TLS_REQCERT=false

      #################
      # MISCELLANEOUS #
      #################
      #- SILENT_INIT=false
      #- AUTO_DB_INIT=false
      #- AUTO_DB_UPDATE=false

      ###########
      # PLUGINS #
      ###########
      #- USE_INDIGO=false
      #- INDIGO_URL=http://chem-plugin/
      #- USE_FINGERPRINTER=false
      #- FINGERPRINTER_URL=http://chem-plugin:8000/
      #- USE_OPENCLONING=false
      #- OPENCLONING_URL=http://opencloning-plugin:8000/

      #######
      # DEV #
      #######
      #- DEV_MODE=false

    # Expose eLabFTW UI and API to the whole LAN via the Windows host IP.
    ports:
      - '443:443'

    volumes:
      - /var/elabftw/web:/elabftw/uploads
      #- /etc/letsencrypt:/ssl
      #- /path/to/cert/folder:/mysql-cert

    networks:
      - elabftw-net

    # extra_hosts:
    #   - internal.s3.example.org:10.12.34.56

  mysql:
    image: mysql:8.0
    restart: always
    container_name: mysql
    healthcheck:
      test: "/usr/bin/mysql --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --execute 'SHOW DATABASES;'"
      interval: 5s
      timeout: 5s
      retries: 42
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - SYS_CHROOT
      - SETFCAP
      - NET_RAW
    cap_add:
      - SYS_NICE
    environment:
      - MYSQL_ROOT_PASSWORD=WbeDStKG0X5Pj7qsHk5PRBzsXAqIWKw
      - MYSQL_DATABASE=elabftw
      - MYSQL_USER=elabftw
      - MYSQL_PASSWORD=VCYxpomuh4hCHrKITRQR0snVF10v2bv
      - TZ=Europe/Paris
      # - MYSQL_TCP_PORT=3306

    volumes:
      - /var/elabftw/mysql:/var/lib/mysql

    # Keep MySQL private to the host while preserving host-local access if needed.
    ports:
      - '127.0.0.1:3306:3306'

    expose:
      - '3306'

    networks:
      - elabftw-net

